<!DOCTYPE html>
<html lang="en">
<head><

<style>
  box-sizing:border-box;

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080c16;
  color:white;
}

header{
  padding:22px 18px;
  text-align:center;
  background:linear-gradient(135deg,#171f3d,#0b1020);
  border-bottom:1px solid #293252;
}

.logo{
  font-size:38px;
  font-weight:bold;
}

.logo span{
  color:#6c63ff;
}

.subtitle{
  color:#b9bfd3;
  font-size:17px;
  margin-top:8px;
}

.container{
  max-width:760px;
  margin:auto;
  padding:18px;
}

.card{
  background:#151b2d;
  border:1px solid #293252;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h2{
  margin-top:0;
  font-size:24px;
}

label{
  display:block;
  color:#cbd1e4;
  margin:14px 0 7px;
  font-size:14px;
}

input,select{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #394363;
  background:#0e1428;
  color:white;
  font-size:16px;
  outline:none;
}

input:focus,select:focus{
  border-color:#6c63ff;
}

button{
  width:100%;
  padding:16px;
  margin-top:18px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#6c63ff,#8b5cf6);
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.result{
  display:none;
  margin-top:20px;
}

.short{
  background:#0e1428;
  border:1px solid #303a60;
  padding:15px;
  border-radius:14px;
  margin-top:12px;
}

.badge{
  display:inline-block;
  background:#272f55;
  color:#bfc6ff;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  margin-bottom:8px;
}

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.feature{
  text-align:center;
  background:#0e1428;
  border-radius:14px;
  padding:18px 8px;
  border:1px solid #293252;
}

.icon{
  font-size:28px;
  margin-bottom:8px;
}

.feature p{
  margin:0;
  color:#b9bfd3;
  font-size:13px;
}
